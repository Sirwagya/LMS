[package]
name = "vedam-lms-desktop"
version = "0.1.0"
edition = "2024"
description = "Native macOS desktop shell for Vedam LMS"

[lib]
name = "vedam_lms_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
futures-util = "0.3"
lms-grader = { path = "../crates/lms-grader" }
lms-sync = { path = "../crates/lms-sync" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
security-framework = "3.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.1", features = ["macos-private-api"] }
tauri-plugin-dialog = "2.0"
tauri-plugin-notification = "2.0"
tauri-plugin-opener = "2.0"
tokio = { version = "1.41", features = ["full"] }
uuid = { version = "1.11", features = ["v7"] }

[dev-dependencies]
tempfile = "3.13"
