[package]
name = "lms-grader"
version = "0.1.0"
edition = "2024"

[dependencies]
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.13"
thiserror = "2.0"
tokio = { version = "1.41", features = ["fs", "io-util", "macros", "process", "signal", "rt-multi-thread", "sync", "time"] }
