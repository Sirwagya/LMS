services:
  postgres:
    image: postgres:17-alpine
    container_name: vedam-lms-postgres
    environment:
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: lms_local_dev
      POSTGRES_DB: lms_dev
    ports:
      - "5432:5432"
    volumes:
      - lms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms -d lms_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: vedam-lms-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - lms_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  lms_pgdata:
  lms_redisdata:
